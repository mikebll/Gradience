name: Arch Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Arch Linux (x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            blueprint-compiler \
            gettext \
            git \
            glib2 \
            gobject-introspection \
            gtk4 \
            libadwaita \
            libsoup3 \
            meson \
            ninja \
            python \
            python-gobject \
            python-lxml
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: meson setup build --prefix=/usr --buildtype=debugoptimized
      - name: Compile
        run: meson compile -C build
      - name: Run tests
        run: meson test -C build --print-errorlogs
      - name: Stage installation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pkgroot"
          DESTDIR="$GITHUB_WORKSPACE/pkgroot" meson install -C build
      - name: Create x86-64 pacman package
        run: |
          short_sha=$(printf '%.7s' "$GITHUB_SHA")
          version="0.8.0_beta2.r0.g${short_sha}"
          pkgdir="$GITHUB_WORKSPACE/pkgroot"
          cat > "$pkgdir/.PKGINFO" <<EOF
          pkgname = gradience-gnome51
          pkgbase = gradience-gnome51
          pkgver = ${version}-1
          pkgdesc = GTK4 and libadwaita app for theming GNOME, with GNOME Shell 51 support
          url = https://github.com/mikebll/Gradience
          builddate = $(date +%s)
          packager = Gradience fork CI
          size = $(du -sb "$pkgdir" | cut -f1)
          arch = x86_64
          license = GPL-3.0-or-later
          depend = gtk4
          depend = libadwaita
          depend = libsoup3
          depend = python
          depend = python-gobject
          depend = python-lxml
          depend = python-libsass
          depend = python-anyascii
          depend = python-material-color-utilities
          depend = python-svglib
          depend = python-yapsy
          depend = python-jinja
          EOF
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar --zstd -cf "$GITHUB_WORKSPACE/dist/gradience-gnome51-${version}-x86_64.pkg.tar.zst" -C "$pkgdir" .PKGINFO usr
          pacman -Qip "$GITHUB_WORKSPACE/dist/gradience-gnome51-${version}-x86_64.pkg.tar.zst"
          pacman -U --noconfirm --nodeps --nodeps "$GITHUB_WORKSPACE/dist/gradience-gnome51-${version}-x86_64.pkg.tar.zst"
          pacman -Q gradience-gnome51
      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: gradience-gnome51-x86_64-pkg
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
